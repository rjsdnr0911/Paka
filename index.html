<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>공룡 게임 - Dino Game</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="game-container">
        <div class="game-header">
            <h1>🦖 공룡 게임</h1>
            <div class="score-board">
                <span>점수: <span id="score">0</span></span>
                <span>최고점수: <span id="highScore">0</span></span>
            </div>
        </div>

        <canvas id="gameCanvas"></canvas>

        <div id="gameOver" class="game-over hidden">
            <h2>게임 오버!</h2>
            <p>점수: <span id="finalScore">0</span></p>
            <button id="restartBtn">다시 시작</button>
        </div>

        <div class="game-instructions">
            <p><strong>조작법:</strong> ↑/스페이스 점프 | ↓ 숙이기 | ESC/P 일시정지</p>
            <p><strong>특별 기능:</strong> 장애물 회피 콤보 시스템 | 낮/밤 자동 전환 (100점마다)</p>
        </div>

        <div class="game-features">
            <div class="feature">✨ 5종류의 선인장</div>
            <div class="feature">🦅 날아다니는 새</div>
            <div class="feature">🌙 낮/밤 모드</div>
            <div class="feature">💫 파티클 효과</div>
            <div class="feature">🏆 콤보 시스템</div>
        </div>
    </div>

    <script src="game.js"></script>
</body>
</html>
